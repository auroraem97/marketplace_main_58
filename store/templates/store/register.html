{% extends 'store/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow-sm border-0 p-4" style="max-width: 420px; width: 100%; border-radius: 16px;">
        <h3 class="text-center fw-bold mb-4">Registro</h3>
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type|default:'text' }}" 
                           name="{{ field.name }}" 
                           class="form-control" 
                           placeholder="{{ field.label }}"
                           required>
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                Registrarse
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-decoration-none">Inicia sesión</a></small>
        </div>
    </div>
</div>
{% endblock %}
