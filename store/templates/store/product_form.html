{% extends 'store/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-10 px-4">
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 sm:p-10">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
            <h2 class="text-2xl font-extrabold text-slate-800">Gestionar Producto</h2>
            <a href="{% url 'dashboard' %}" class="text-sm font-semibold text-slate-500 hover:text-slate-800">
                &larr; Volver al panel
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            
            {% for field in form %}
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">
                    {{ field.label }}
                </label>
                <div class="[&>input]:w-full [&>input]:px-4 [&>input]:py-2.5 [&>input]:border [&>input]:border-slate-200 [&>input]:rounded-xl [&>textarea]:w-full [&>textarea]:px-4 [&>textarea]:py-2.5 [&>textarea]:border [&>textarea]:border-slate-200 [&>textarea]:rounded-xl [&>select]:w-full [&>select]:px-4 [&>select]:py-2.5 [&>select]:border [&>select]:border-slate-200 [&>select]:rounded-xl">
                    {{ field }}
                </div>
                {% if field.errors %}
                    <p class="text-rose-600 text-xs mt-1 font-medium">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'dashboard' %}" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-full transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="px-8 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-full shadow-lg shadow-indigo-500/30 transition-all">
                    Guardar Producto
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
