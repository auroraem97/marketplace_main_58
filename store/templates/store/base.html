<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marketplace</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CSS (para que se vean bien tus tarjetas, dashboard y carrito) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand font-extrabold tracking-tight text-indigo-400" href="/">Marketplace</a>

        <div class="flex items-center gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'cart_detail' %}" class="text-white text-decoration-none hover:text-indigo-300 font-medium me-2">
                    Carrito
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-success btn-sm rounded-pill px-3 me-2">
                    Dashboard
                </a>
                <span class="text-white me-2">Hola, {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm rounded-pill px-3 me-2">Login</a>
                <a href="{% url 'register' %}" class="btn btn-primary btn-sm rounded-pill px-3">Registro</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
